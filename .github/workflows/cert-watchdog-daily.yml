name: Munifi — Daily cert refresh + watchdog

# Updates certifications/verifications once a day and runs the Vendor Cert
# Watchdog (which composes expiry notices — gated by AUTONOMOUS_SEND, so no
# email actually goes out until the operator turns it on).
#
# Runs at 06:00 America/Los_Angeles (PDT = 13:00 UTC). GitHub cron is UTC and
# has no DST, so this is 06:00 during PDT / 05:00 during PST — acceptable for a
# daily maintenance job.
#
# "Update on command": trigger manually here via the Run workflow button
# (workflow_dispatch), or from the dashboard button which POSTs the endpoint.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY   (for the cert refresh upsert)
#   DISPATCH_SECRET                            (optional; if the endpoint is guarded)
#   WATCHDOG_URL                               (optional; defaults to the prod endpoint)

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      notify:
        description: 'Compose vendor expiry notices (still gated by AUTONOMOUS_SEND)'
        type: boolean
        default: true

jobs:
  refresh-and-watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: pip install -r requirements.txt python-dotenv supabase

      # Best-effort source re-scrape (CMD/CSLB). Continue on error so a scraper
      # hiccup never blocks the Supabase re-verify + watchdog below.
      - name: Refresh cert sources (best effort)
        continue-on-error: true
        run: |
          python -m playwright install --with-deps chromium || true
          python scripts/agents/cmd-scraper-playwright.py || true
          python scripts/agents/cslb-enrichment-agent.py || true

      - name: Upsert certs + verifications into Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/migrate-to-supabase.py

      - name: Rebalance assignments + audit (Phase 5)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/agents/assignment-agent.py

      - name: Purge expired citizen emails (Phase 4 PII hygiene)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/agents/purge-contacts.py

      - name: Run Vendor Cert Watchdog (+ gated expiry notices)
        env:
          WATCHDOG_URL: ${{ secrets.WATCHDOG_URL }}
          DISPATCH_SECRET: ${{ secrets.DISPATCH_SECRET }}
        run: |
          URL="${WATCHDOG_URL:-https://munifi-gov-dispatch-pack.vercel.app/api/v2/watchdog}"
          AUTH=()
          [ -n "$DISPATCH_SECRET" ] && AUTH=(-H "Authorization: Bearer $DISPATCH_SECRET")
          curl -fsS -X POST "${URL}?notify=true&format=json" \
            "${AUTH[@]}" -H "Content-Type: application/json" | tee watchdog-report.json
          echo "Buckets:"; cat watchdog-report.json | python -c "import sys,json; d=json.load(sys.stdin); print(d.get('buckets')); n=d.get('notifications'); print('notices:', n and {k:n[k] for k in ('attempted','suppressed','sent')})"

      - uses: actions/upload-artifact@v4
        with:
          name: watchdog-report
          path: watchdog-report.json
