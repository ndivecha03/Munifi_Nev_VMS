<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SF DPW — Sidewalk Repair Survey</title>
<style>
  :root{--ink:#0a1f3d;--mut:#5b6b82;--accent:#0a6cb4;--line:#dce3ec;--bg:#f4f7fb;--ok:#1f6a37}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);font:15px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--ink)}
  .wrap{max-width:560px;margin:0 auto;padding:28px 18px 64px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px 24px;box-shadow:0 1px 4px rgba(10,31,61,.05)}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--mut);font-size:13px;margin:0 0 20px}
  .q{margin:20px 0;padding-top:18px;border-top:1px solid var(--line)}
  .q:first-of-type{border-top:none;padding-top:0}
  .q label.qlabel{display:block;font-weight:600;margin-bottom:10px}
  .opts{display:flex;gap:8px;flex-wrap:wrap}
  .opt{flex:1;min-width:64px;text-align:center;padding:10px 6px;border:2px solid var(--line);border-radius:9px;cursor:pointer;font-size:13px;font-weight:600;background:#fff;transition:.12s}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--accent);background:#e8f1f9;color:var(--accent)}
  .scale{display:flex;gap:6px}
  .scale .opt{min-width:0}
  textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;font:inherit;resize:vertical;min-height:64px}
  .submit{margin-top:24px;width:100%;padding:14px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
  .submit:disabled{background:#c8ced6;cursor:not-allowed}
  .done{text-align:center;padding:40px 10px}
  .done .check{width:54px;height:54px;border-radius:50%;background:#e2f2e7;color:var(--ok);display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 14px}
  .err{color:#b3261e;font-size:13px;margin-top:10px}
  .foot{color:var(--mut);font-size:12px;text-align:center;margin-top:18px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="card">
    <h1>How did your sidewalk repair go?</h1>
    <p class="sub">5 quick questions about work order <strong id="cid">—</strong>. Takes under a minute.</p>

    <div class="q" data-key="completed" data-type="choice">
      <label class="qlabel">1. Was the repair completed?</label>
      <div class="opts">
        <div class="opt" data-val="yes">Yes, fixed</div>
        <div class="opt" data-val="partial">Partially</div>
        <div class="opt" data-val="no">No</div>
      </div>
    </div>

    <div class="q" data-key="quality" data-type="scale"><label class="qlabel">2. Quality of the work (1–5)</label><div class="scale opts"></div></div>
    <div class="q" data-key="timeliness" data-type="scale"><label class="qlabel">3. Timeliness (1–5)</label><div class="scale opts"></div></div>
    <div class="q" data-key="professionalism" data-type="scale"><label class="qlabel">4. Professionalism &amp; communication (1–5)</label><div class="scale opts"></div></div>
    <div class="q" data-key="satisfaction" data-type="scale"><label class="qlabel">5. Overall satisfaction (1–5)</label><div class="scale opts"></div></div>

    <div class="q"><label class="qlabel">Anything else? (optional)</label><textarea id="comment" maxlength="2000" placeholder="Tell us more…"></textarea></div>

    <button class="submit" id="submitBtn" disabled>Submit survey</button>
    <div class="err" id="err"></div>
  </div>
  <p class="foot">San Francisco Public Works · Sidewalk Inspection &amp; Repair Program</p>
</div>
<script>
  const params = new URLSearchParams(location.search);
  const complaintId = params.get('id') || '';
  const token = params.get('token') || '';
  document.getElementById('cid').textContent = complaintId || '(unknown)';

  const answers = { completed: null, quality: null, timeliness: null, professionalism: null, satisfaction: null };

  // Build 1–5 scales
  document.querySelectorAll('.q[data-type="scale"]').forEach(q => {
    const key = q.dataset.key;
    const row = q.querySelector('.scale');
    for (let i = 1; i <= 5; i++) {
      const d = document.createElement('div');
      d.className = 'opt'; d.textContent = i; d.dataset.val = i;
      d.onclick = () => choose(q, key, i, d);
      row.appendChild(d);
    }
  });
  document.querySelectorAll('.q[data-type="choice"] .opt').forEach(o => {
    o.onclick = () => choose(o.closest('.q'), o.closest('.q').dataset.key, o.dataset.val, o);
  });

  function choose(q, key, val, el) {
    q.querySelectorAll('.opt').forEach(x => x.classList.remove('sel'));
    el.classList.add('sel');
    answers[key] = val;
    document.getElementById('submitBtn').disabled = !answers.completed; // Q1 required
  }

  document.getElementById('submitBtn').onclick = async () => {
    const btn = document.getElementById('submitBtn'); const err = document.getElementById('err');
    err.textContent = ''; btn.disabled = true; btn.textContent = 'Submitting…';
    try {
      const res = await fetch('/api/survey-submit', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ complaint_id: complaintId, token, comment: document.getElementById('comment').value, ...answers }),
      });
      const d = await res.json();
      if (!res.ok) throw new Error(d.error || 'Submission failed');
      document.getElementById('card').innerHTML =
        '<div class="done"><div class="check">✓</div><h1>Thank you!</h1>' +
        '<p class="sub">Your feedback was recorded for work order ' + complaintId + '. It helps SF DPW improve future sidewalk repairs.</p></div>';
    } catch (e) {
      err.textContent = e.message; btn.disabled = false; btn.textContent = 'Submit survey';
    }
  };
</script>
</body>
</html>
