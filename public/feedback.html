<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Sidewalk Repair Feedback — SF DPW</title>
  <style>
    /* Mobile-first, minimal — City of SF palette. No framework. */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 480px;
      margin: 0 auto;
      padding: 32px 20px;
      background: #f5f5f0;
      color: #1a1a1a;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .logo {
      font-size: 13px;
      color: #666;
      margin-bottom: 24px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-weight: 600;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 28px 24px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      margin: 0 0 12px;
      line-height: 1.3;
    }
    .outcome-badge {
      display: inline-block;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      margin: 4px 0 16px;
    }
    .outcome-completed  { background: #e6f4ea; color: #1a7a3a; }
    .outcome-incomplete { background: #fce8e6; color: #b31412; }
    .outcome-partial    { background: #fff3e0; color: #b06000; }
    .status {
      font-size: 15px;
      color: #444;
      line-height: 1.55;
      margin: 0 0 12px;
    }
    .meta {
      font-size: 13px;
      color: #888;
      margin-top: 16px;
    }
    .error {
      color: #b31412;
      font-size: 14px;
      margin-top: 12px;
      line-height: 1.5;
    }
    .spinner {
      display: inline-block;
      width: 22px;
      height: 22px;
      border: 2px solid #d8d8d8;
      border-top-color: #1a1a1a;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .footer {
      font-size: 12px;
      color: #888;
      margin-top: 24px;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="logo">City &amp; County of San Francisco · DPW</div>
  <div class="card" id="card">
    <p class="status"><span class="spinner" aria-hidden="true"></span>Recording your response…</p>
  </div>
  <p class="footer">
    Sidewalk Inspection &amp; Repair Program<br>
    Department of Public Works
  </p>

  <script>
    (async () => {
      const params  = new URLSearchParams(window.location.search);
      const id      = (params.get('id') || '').trim();
      const outcome = (params.get('outcome') || '').trim().toLowerCase();
      const token   = (params.get('token') || '').trim().toLowerCase();
      const card    = document.getElementById('card');

      const VALID_OUTCOMES = ['completed', 'incomplete', 'partial'];

      if (!id || !outcome || !token) {
        card.innerHTML =
          '<h1>Invalid link</h1>'
          + '<p class="error">This feedback link is missing required information. '
          + 'Please use the link from your email, or contact SF DPW.</p>';
        return;
      }
      if (!VALID_OUTCOMES.includes(outcome)) {
        card.innerHTML =
          '<h1>Invalid response</h1>'
          + '<p class="error">The outcome value in this link is not recognized. '
          + 'Please use one of the three links from your email.</p>';
        return;
      }

      try {
        const resp = await fetch('/api/feedback-submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ complaint_id: id, outcome, token }),
        });
        const data = await resp.json().catch(() => ({}));

        if (resp.ok && data.success) {
          const OUTCOMES = {
            completed: {
              label: '✓ Repair completed',
              cls: 'outcome-completed',
              msg: 'Thank you. Your response helps the City improve how it selects contractors for future sidewalk repairs.',
            },
            incomplete: {
              label: '✗ Not yet repaired',
              cls: 'outcome-incomplete',
              msg: "We're sorry the repair hasn't been completed. A DPW supervisor will review this case and follow up.",
            },
            partial: {
              label: '◑ Partially repaired',
              cls: 'outcome-partial',
              msg: "Thank you. We'll flag this case for a follow-up inspection.",
            },
          };
          const o = OUTCOMES[outcome];
          card.innerHTML =
            '<h1>Response recorded</h1>'
            + '<span class="outcome-badge ' + o.cls + '">' + o.label + '</span>'
            + '<p class="status">' + o.msg + '</p>'
            + '<p class="meta">Case: ' + id + '</p>';
        } else {
          // Server rejected — likely already recorded, or invalid token format.
          const errMsg = data.error || 'Could not record your response.';
          card.innerHTML =
            '<h1>Could not record response</h1>'
            + '<p class="error">' + errMsg + '</p>'
            + '<p class="meta">Case: ' + id + '</p>';
        }
      } catch (err) {
        card.innerHTML =
          '<h1>Something went wrong</h1>'
          + '<p class="error">We could not record your response right now. '
          + 'Please try the link again in a few minutes, or contact SF DPW directly.</p>'
          + '<p class="meta">Case: ' + id + '</p>';
      }
    })();
  </script>
</body>
</html>
